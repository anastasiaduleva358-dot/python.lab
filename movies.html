{% extends 'base.html' %}

{% block content %}

<h2>Список фильмов</h2>

<form method="GET">

    <input type="text" name="search" placeholder="Поиск">

    <select name="genre">
        <option value="">Все жанры</option>

        {% for g in genres %}
            <option value="{{ g.genre }}">
                {{ g.genre }}
            </option>
        {% endfor %}
    </select>

    <button type="submit">Найти</button>

</form>

<br>

<a href="/items?sort=rating">Рейтинг</a> |
<a href="/items?sort=year">Год</a> |
<a href="/items">Сброс</a>

<div class="container">

{% for movie in movies %}

<div class="card">

    <img src="{{ movie.image }}">

    <h3>{{ movie.title }}</h3>

    <p>{{ movie.genre }}</p>

    <p>⭐ {{ movie.rating }}</p>

    <a href="/items/{{ movie.id }}">
        Подробнее
    </a>

    <br><br>

    <a href="/edit/{{ movie.id }}">
        Редактировать
    </a>

    <br><br>

    <a href="/delete/{{ movie.id }}">
        Удалить
    </a>

</div>

{% endfor %}

</div>

{% endblock %}

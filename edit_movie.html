{% extends 'base.html' %}

{% block content %}

<h2>Редактировать фильм</h2>

{% if error %}
<p>{{ error }}</p>
{% endif %}

<form method="POST">

<input type="text"
name="title"
value="{{ movie.title }}">

<br><br>

<input type="text"
name="genre"
value="{{ movie.genre }}">

<br><br>

<input type="text"
name="rating"
value="{{ movie.rating }}">

<br><br>

<input type="text"
name="year"
value="{{ movie.year }}">

<br><br>

<input type="text"
name="image"
value="{{ movie.image }}">

<br><br>

<button type="submit">
Сохранить
</button>

</form>

{% endblock %}
